[project]
name = "project-etu"
version = "0.3.0"
description = "AI pipelining for dynamic 3D model creation — video and text to interactive 4D scenes"
requires-python = ">=3.12"

# Ruff and black share the same line length so `format` never fights `lint`.
[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
target-version = "py312"
line-length = 88
