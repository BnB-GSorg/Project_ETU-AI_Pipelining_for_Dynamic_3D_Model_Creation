# Builds the project's interactive overview into a GitHub Pages site and
# deploys it, so the diagram runs in a browser at <site>/workflow/overview.html
# instead of being shown as raw HTML source on github.com.
#
# GitHub never renders .html files from a repository (anyone could otherwise
# run script under github.com's origin), so this is the supported path.
name: Deploy Pages

on:
  push:
    # Both the working branch and main, so the site keeps updating after the
    # branch is merged -- the environment branch policy already allows both.
    branches: [main, MCHIGM/20260929-entireproject_bugfix]
    paths:
      - src/assets/demo/**
      - src/assets/test/golden/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site under /workflow and /example
        run: |
          mkdir -p _site/workflow _site/example

          # /workflow — the interactive pipeline diagram.
          cp src/assets/demo/overview.html _site/workflow/overview.html

          # /example — the viewer playing the golden demo scene. main.js imports
          # viewcube.js by relative path, so all three sit together; the scene
          # is the byte-stable demo output.
          cp src/assets/demo/viewer/index.html _site/example/viewer.html
          cp src/assets/demo/viewer/main.js _site/example/main.js
          cp src/assets/demo/viewer/viewcube.js _site/example/viewcube.js
          cp src/assets/test/golden/rubiks_solve.mmi _site/example/rubiks_solve.mmi
          printf '<!DOCTYPE html><html><head><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=viewer.html?file=rubiks_solve.mmi"></head><body></body></html>' > _site/example/index.html

          # Site root bounces to the diagram; the overview is fully
          # self-contained (inline scripts, embedded fonts, data-URI icons),
          # so it needs no sibling files.
          printf '<!DOCTYPE html><html><head><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=workflow/overview.html"></head><body></body></html>' > _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
