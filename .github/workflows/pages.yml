# Builds the project's interactive overview into a GitHub Pages site and
# deploys it, so the diagram runs in a browser at <site>/workflow/overview.html
# instead of being shown as raw HTML source on github.com.
#
# GitHub never renders .html files from a repository (anyone could otherwise
# run script under github.com's origin), so this is the supported path.
name: Deploy Pages

on:
  push:
    branches: [MCHIGM/20260929-entireproject_bugfix]
    paths:
      - src/assets/demo/overview.html
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site under /workflow
        run: |
          mkdir -p _site/workflow
          cp src/assets/demo/overview.html _site/workflow/overview.html
          # The overview is fully self-contained (inline scripts, embedded
          # fonts, data-URI icons), so it needs no sibling files.
          printf '<!DOCTYPE html><html><head><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=workflow/overview.html"></head><body></body></html>' > _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
