# Project ETU - Python environment
#
# Create:  mamba env create --prefix .env/Python/etu -f environment.yml
# Update:  mamba env update --prefix .env/Python/etu -f environment.yml --prune
# Use:     conda activate ./.env/Python/etu
#
# The built environment lives in .env/Python/etu and is NOT committed.
# This file is the single source of truth - add dependencies here, never ad hoc.
#
# If mamba reports "no writable cache directory", prefix the command with:
#   CONDA_PKGS_DIRS=.env/Python/.pkgs

name: etu

channels:
  - conda-forge

dependencies:
  # Runtime — pinned to the exact versions the engine is developed against.
  # Reproducibility note: the compiled .mmi output is byte-stable only if
  # numpy/OpenBLAS stay on these pins (float results can shift otherwise).
  - python=3.12.14
  - numpy=2.5.3
  - libopenblas=0.3.34   # the BLAS behind numpy; pinned for byte-stable output
  - opencv=5.0.0     # deterministic CV for FeatureGraph extraction (imports as cv2)

  # Test + lint
  - pytest=9.1.1
  - ruff=0.16.6
  - black=26.5.1
